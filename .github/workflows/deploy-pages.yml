name: Publish Jupyter Book 2 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_URL: /apuntes-robotica

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy HTML
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Jupyter Book 2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build static HTML (without executing notebooks)
        run: jupyter book build --html --strict
      - name: Inject Statcounter into generated HTML
        run: python scripts/inject_statcounter.py
      - name: Verify production URLs, assets and Statcounter
        run: python scripts/check_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
