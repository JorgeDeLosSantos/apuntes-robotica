name: Validate Jupyter Book 2 (migration)

on:
  push:
    branches:
      - feat/jupyter-book-2-migration
  workflow_dispatch:

concurrency:
  group: jb2-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build JB2 static HTML
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Jupyter Book 2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          jupyter book --version
      - name: Build HTML (no notebook execution)
        shell: bash
        run: |
          set -o pipefail
          jupyter book build --html 2>&1 | tee jb2-build.log
      - name: Store build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jb2-build-log
          path: jb2-build.log
          if-no-files-found: ignore
      - name: Store generated site for review
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: jb2-html-preview
          path: _build/html/
          if-no-files-found: warn
