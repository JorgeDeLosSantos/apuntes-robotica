name: Validate Jupyter Book 2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: /apuntes-robotica

concurrency:
  group: jb2-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate HTML
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Jupyter Book 2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          jupyter book --version
      - name: Build HTML for project GitHub Pages URL (without executing notebooks)
        shell: bash
        run: |
          set -o pipefail
          jupyter book build --html --strict 2>&1 | tee jb2-build.log
      - name: Inject Statcounter into generated HTML
        run: python scripts/inject_statcounter.py
      - name: Validate generated URLs, assets and Statcounter
        run: python scripts/check_site.py
      - name: Store build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jb2-build-log
          path: jb2-build.log
          if-no-files-found: ignore
      - name: Store generated site for review
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: jb2-html-preview
          path: _build/html/
          if-no-files-found: error
