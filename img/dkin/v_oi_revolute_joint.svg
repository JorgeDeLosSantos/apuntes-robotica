<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" role="img" aria-labelledby="t d">
<title id="t">Velocidad del origen del sistema i para una articulación revoluta</title>
<desc id="d">Esquema de una articulación de revolución i y el eslabón i, con el sistema anterior en el origen o sub i menos uno, el sistema i en el origen o sub i, la dirección del eje z anterior, la velocidad angular, los vectores de velocidad y el vector relativo entre orígenes.</desc>
<defs>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1676a2"/></marker>
<marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526571"/></marker>
<marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#15896f"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#26424a}.label{font-size:23px;font-weight:600}.note{font-size:17px;fill:#57717c}.vec{stroke:#1676a2;stroke-width:5;fill:none;marker-end:url(#arrowBlue)}.axis{stroke:#526571;stroke-width:3.5;fill:none;marker-end:url(#arrowGray)}</style>
</defs>
