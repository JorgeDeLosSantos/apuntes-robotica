<text x="540.08" y="268.31" fill="#2563eb" font-size="20" font-family="Arial,sans-serif" font-style="italic">xᵢ</text>
<text x="664.73" y="247.75" fill="#40516b" font-size="20" font-family="Arial,sans-serif" font-style="italic">zᵢ</text>
<text x="210" y="615" fill="#475569" font-size="15" font-family="Arial,sans-serif">Sistema {i−1}</text>
<text x="575" y="343" fill="#475569" font-size="15" font-family="Arial,sans-serif">Sistema {i}</text>
<!-- Legend -->
<text x="749" y="133" font-family="Arial,sans-serif" font-size="21" fill="#1f2937" font-weight="700">Mediciones</text>
<rect x="747" y="151" width="339" height="98" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
<text x="766" y="184" font-family="Arial,sans-serif" font-size="25" font-style="italic" fill="#9a3412">θᵢ</text>
<text x="813" y="181" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Rotación</text>
<text x="765" y="208" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">alrededor de zᵢ₋₁</text>
<text x="765" y="231" font-family="Arial,sans-serif" font-size="14" fill="#9a3412">De xᵢ₋₁ hacia xᵢ</text>
<rect x="747" y="260" width="339" height="98" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="766" y="294" font-family="Arial,sans-serif" font-size="25" font-style="italic" fill="#166534">dᵢ</text>
<text x="813" y="292" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#166534">Desplazamiento</text>
<text x="765" y="322" font-family="Arial,sans-serif" font-size="16" fill="#166534">a lo largo de zᵢ₋₁</text>
<rect x="747" y="369" width="339" height="98" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="766" y="405" font-family="Arial,sans-serif" font-size="25" font-style="italic" fill="#166534">aᵢ</text>
