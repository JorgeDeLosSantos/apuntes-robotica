<line x1="303" y1="358.75" x2="344" y2="358.75" stroke="#86a69a" stroke-width="1.5"/>
<path d="M 313,560 L 313,358.75" fill="none" stroke="#15803d" stroke-width="3" marker-start="url(#dimensionHead)" marker-end="url(#dimensionHead)"/>
<text x="260" y="459.38" fill="#166534" font-size="23" font-family="Arial,sans-serif" font-style="italic">dᵢ</text>
