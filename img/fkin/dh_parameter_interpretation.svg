<text x="438" y="391" fill="#b45309" font-size="24" font-family="Arial,sans-serif" font-style="italic">θᵢ</text>
<text x="595.08" y="201.31" fill="#b45309" font-size="24" font-family="Arial,sans-serif" font-style="italic">αᵢ</text>
<!-- Origin markers -->
<circle cx="340" cy="560" r="5.5" fill="#172033" stroke="#fff" stroke-width="1.5"/>
<circle cx="340" cy="358.75" r="5.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
