<text x="327" y="589" text-anchor="end" fill="#1f2937" font-size="17" font-family="Arial,sans-serif">oᵢ₋₁</text>
<text x="318" y="345.75" text-anchor="end" fill="#2563eb" font-size="16" font-family="Arial,sans-serif">H</text>
<text x="535.08" y="326.31" fill="#1f2937" font-size="17" font-family="Arial,sans-serif">oᵢ</text>
<text x="345" y="181" fill="#40516b" font-size="20" font-family="Arial,sans-serif" font-style="italic">zᵢ₋₁</text>
