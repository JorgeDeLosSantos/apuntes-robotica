<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Interpretación geométrica de los parámetros Denavit–Hartenberg clásicos</title>
<desc id="diagram-desc">Dos sistemas consecutivos con ejes z anterior y actual, eje x actual como normal común. Las distancias d y a aparecen como flechas rectas a lo largo de z anterior y x actual; los ángulos theta y alfa como arcos alrededor de esos ejes, respectivamente. También se muestran las direcciones transportadas usadas para comparar las orientaciones.</desc>
<defs>
<marker id="axisHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#40516b"/></marker>
<marker id="xHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#2563eb"/></marker>
<marker id="dimensionHead" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto-start-reverse"><path d="M0,0 L7,4 L0,8Z" fill="#15803d"/></marker>
<marker id="angleHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#c2410c"/></marker>
</defs>
<rect width="1120" height="680" fill="#ffffff"/>
<text x="34" y="45" fill="#172033" font-size="28" font-family="Arial, sans-serif" font-weight="700">Interpretación de los cuatro parámetros DH</text>
<text x="34" y="78" fill="#506078" font-size="17" font-family="Arial, sans-serif">Convención clásica · Sistemas consecutivos {i−1} e {i} · Esquema tridimensional proyectado</text>
<path d="M715,109 L715,625" stroke="#e2e8f0" stroke-width="2"/>
<rect x="24" y="102" width="675" height="526" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
