<text x="765" y="431" font-family="Arial,sans-serif" font-size="16" fill="#166534">a lo largo de xᵢ (normal común)</text>
<rect x="747" y="478" width="339" height="98" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
<text x="766" y="513" font-family="Arial,sans-serif" font-size="25" font-style="italic" fill="#9a3412">αᵢ</text>
<text x="813" y="511" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Rotación</text>
<text x="765" y="540" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">alrededor de xᵢ</text>
<text x="765" y="562" font-family="Arial,sans-serif" font-size="14" fill="#9a3412">De zᵢ₋₁ hacia zᵢ</text>
<text x="752" y="610" font-family="Arial,sans-serif" font-size="15" fill="#475569">xᵢ interseca zᵢ₋₁ y zᵢ,</text>
<text x="752" y="632" font-family="Arial,sans-serif" font-size="15" fill="#475569">y es perpendicular a ambos.</text>
<text x="34" y="655" font-family="Arial,sans-serif" font-size="14" fill="#64748b">H: intersección de xᵢ con zᵢ₋₁. Las direcciones paralelas punteadas ayudan a interpretar los ángulos.</text>
</svg>