<path d="M 320.5,554.8 L 514,606.4" stroke="#40516b" stroke-width="3.1" fill="none" marker-end="url(#axisHead)"/>
<!-- Auxiliary transported axis at H -->
<path d="M 340,358.75 L 478,395.55" stroke="#94a3b8" stroke-dasharray="8,7" stroke-width="2" fill="none"/>
<text x="479" y="389.75" fill="#64748b" font-size="16" font-family="Arial,sans-serif">∥ xᵢ₋₁</text>
<!-- Next frame z axis -->
<path d="M 494.47,298.39 L 676.55,263.64" stroke="#40516b" stroke-width="3.6" fill="none" marker-end="url(#axisHead)"/>
