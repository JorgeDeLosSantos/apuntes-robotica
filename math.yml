# Shared LaTeX math notation for the robotics notes.
# Consolidated from the original JB1 notebook and checked in the JB2 build.
version: 1
project:
  math:
    '\vec': '\boldsymbol{\mathbf{#1}}'
    '\vecg': '\boldsymbol{#1}'
    '\atantwo': '\text{arctan2} \left( #1,\, #2 \right)'
    '\arctantwo': '\text{arctan2} \left( #1,\, #2 \right)'
    '\vecuni': '\hat{\boldsymbol{\mathbf{#1}}}'
    '\framei': '\{#1\}'
    '\ejt': 'e^{j\theta_{#1}}'
    '\rp': '\dot{r}_{#1}'
    '\rpp': '\ddot{r}_{#1}'
    '\w': '\omega_{#1}'
    '\sint': '\int_{#1}^{#2} #3 \, #4'
    '\sintp': '\int_{#1}^{#2} \left( #3 \right) \, #4'
    '\dint': '\int_{#1}^{#2} \int_{#3}^{#4} #5 \, #6 \, #7'
    '\dintp': '\int_{#1}^{#2} \int_{#3}^{#4} \left(#5\right) \, #6 \, #7'
    '\sumin': '\sum_{i=1}^{n}'
    '\rbr': '\left( #1 \right)'
    '\sbr': '\left[ #1 \right]'
    '\cbr': '\left\{ #1 \right\}'
    '\abr': '\langle #1 \rangle'
    '\frbr': '\left( \frac{#1}{#2} \right)'
    '\fsbr': '\left[ \frac{#1}{#2} \right]'
    '\fcbr': '\left\{ \frac{#1}{#2} \right\}'
    '\fabr': '\langle \frac{#1}{#2} \rangle'
    '\ffrac': '\frac{ \frac{#1}{#2} }{ \frac{#3}{#4} }'
    '\La': '\mathcal{L}'
    '\Ki': '\mathcal{K}'
    '\Po': '\mathcal{P}'
    '\LaEq': '\frac{d}{dt}\left( \frac{\partial\mathcal{L}}{\partial \dot{q}_{#1}} \right) - \frac{\partial\mathcal{L}}{\partial q_{#1}} = \tau_{#1}'
    '\LaEqA': '\frac{d}{dt}\left( \frac{\partial\mathcal{L}}{\partial \dot{q}_{#1}} \right)'
    '\LaEqB': '\frac{\partial\mathcal{L}}{\partial q_{#1}}'
    '\tauvec': '\boldsymbol{\tau}'
    '\KiEq': '\frac{1}{2} m_{#1} \vec{v}_{G_{#1}}^T \vec{v}_{G_{#1}} + \frac{1}{2} \boldsymbol{\omega}_{#1}^T I_{#1} \boldsymbol{\omega}_{#1}'
    '\KiTraEq': '\frac{1}{2} m_{#1} \vec{v}_{G_{#1}}^T \vec{v}_{G_{#1}}'
    '\KiRotEq': '\frac{1}{2} \boldsymbol{\omega}_{#1}^T I_{#1} \boldsymbol{\omega}_{#1}'
    '\PoEq': '- m_{#1} \vec{g}^T \vec{r}_{G_#1}'
    '\Icm': 'I_{#1}^{{#1}''}'
    '\Isym': '\begin{bmatrix} I_{x_{#1}x_{#1}} & 0 & 0 \\ 0 & I_{y_{#1}y_{#1}} & 0 \\ 0 & 0 & I_{z_{#1}z_{#1}} \\ \end{bmatrix}'
    '\rG': '\vec{r}_{G_{#1}}'
    '\vG': '\vec{v}_{G_{#1}}'
    '\lc': 'l_{c_{#1}}'
    '\qp': '\dot{q}_{#1}'
    '\qpp': '\ddot{q}_{#1}'
    '\cijk': '\frac{1}{2} \left( \frac{\partial m_{#1#2}}{\partial q_{#3}} + \frac{\partial m_{#1#3}}{\partial q_{#2}} - \frac{\partial m_{#2#3}}{\partial q_{#1}} \right)'
    '\wijk': '\boldsymbol{\omega}_{#2,#3}^{#1}'
    '\W': '\boldsymbol{\omega}'
    '\aa': '\alpha_{#1}'
    '\cdt': 'c\theta_{#1}'
    '\sdt': 's\theta_{#1}'
    '\tdt': 't\theta_{#1}'
    '\cdq': 'cq_{#1}'
    '\sdq': 'sq_{#1}'
    '\tdq': 'tq_{#1}'
    '\symlist': '\bullet'
    '\cda': 'c\alpha_{#1}'
    '\sda': 's\alpha_{#1}'
    '\cdtt': 'c\left(\theta_{#1} + \theta_{#2} \right)'
    '\sdtt': 's\left(\theta_{#1} + \theta_{#2} \right)'
    '\colvec': '\begin{bmatrix}#1\\#2\\#3\end{bmatrix}'
    '\rowvec': '\begin{bmatrix}#1&#2&#3\end{bmatrix}'
    '\colvech': '\begin{bmatrix}#1\\#2\\#3 \\ #4\end{bmatrix}'
    '\Tij': 'T_{#1}^{#2}'
    '\Rij': 'R_{#1}^{#2}'
    '\veci': '\boldsymbol{\mathbf{r}}_{#1}^{#2}'
    '\sen': '\operatorname{sen}'
